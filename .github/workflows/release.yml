name: release

# Publish @getanyapi/sdk (npm) and getanyapi (PyPI) for a version tag.
#
# Triggers:
#   - push tag v*: a human-pushed tag (the first manual v0.1.0), or any future manual tag.
#   - workflow_dispatch (input: tag): how regen.yml kicks a release after auto-tagging, since
#     a tag pushed by the default GITHUB_TOKEN does not fire the tag-`push` trigger.
#
# Flow: verify -> query both registries -> publish only missing sides -> wait until both
# serve the exact version -> smoke both exact versions -> GitHub Release -> report the result
# on the regen incident. npm publishes with provenance (id-token). PyPI uses trusted
# publishing (OIDC, environment `pypi`) and never falls back to a token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to release (e.g. v0.1.0). Must already exist."
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Byte-identical to regen.yml's REGEN_ISSUE_TITLE. A failed release files into regen's
  # incident and only a successful one closes it; the upsert deduplicates by exact title.
  REGEN_ISSUE_TITLE: "regen is blocked: the SDKs are not being published"

jobs:
  verify:
    name: verify (full gate + version match)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: resolve tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "tag '$TAG' does not start with 'v'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pnpm install --frozen-lockfile

      - name: assert tag matches both manifests and Python runtime version (lockstep)
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          MANIFEST="$(pnpm --silent --filter @anyapi/generator run version:current)"
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "tag version ($VERSION) does not match manifest version ($MANIFEST)"
            exit 1
          fi
          echo "version match: $VERSION"

      # The gate is shared with regen.yml and accept-catalog-refresh.yml, which run it before
      # they move main or push a tag. It is read from this workflow's own commit, not from the
      # tag: an old-tag recovery dispatched from main checks out a tree that predates the
      # action, and still runs this workflow's gate against it, as it did when the steps were
      # written inline here.
      - name: check out the shared test gate from this workflow's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: test gate (generator, regen drift, TypeScript, Python)
        uses: ./.workflow/.github/actions/test-gate
      - name: credentialless TypeScript live discovery canary
        run: node scripts/live-discovery-ts.mjs
      - name: credentialless Python live discovery canary
        run: python scripts/live-discovery-python.py
      - name: dash guard
        run: bash scripts/check-dashes.sh

  registry-state:
    name: query exact version in both registries
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      npm_exists: ${{ steps.state.outputs.npm_exists }}
      pypi_exists: ${{ steps.state.outputs.pypi_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: query npm and PyPI
        id: state
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/check-registry-version.mjs "$VERSION" --github-output "$GITHUB_OUTPUT"

  publish-npm:
    name: publish @getanyapi/sdk (npm)
    needs: [verify, registry-state]
    if: needs.registry-state.outputs.npm_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: build (tsup -> ESM + CJS + d.ts)
        run: pnpm --filter @getanyapi/sdk run build
      - name: publish
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public --provenance

  publish-pypi:
    name: publish getanyapi (PyPI, trusted publishing)
    needs: [verify, registry-state]
    if: needs.registry-state.outputs.pypi_exists == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: build sdist + wheel
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish via trusted publishing
        # Fails with a clear message until the PyPI trusted publisher is configured (see
        # README "Releasing"). We do NOT fall back to a token; configure the publisher instead.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  verify-published:
    name: wait for exact version in both registries
    needs: [verify, registry-state, publish-npm, publish-pypi]
    if: ${{ always() && needs.verify.result == 'success' && needs.registry-state.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the workflow and checker CLI version matched during old-tag recovery.
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: poll npm and pip's PyPI index until both serve the exact version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/check-registry-version.mjs "$VERSION" --wait

  npm-smoke:
    name: smoke exact npm version
    needs: [verify, verify-published]
    if: ${{ always() && needs.verify.result == 'success' && needs.verify-published.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install exact package into a clean directory and smoke it
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "@getanyapi/sdk@$VERSION"
          cp "$GITHUB_WORKSPACE/smoke/npm-smoke.mjs" ./npm-smoke.mjs
          node npm-smoke.mjs

  pypi-smoke:
    name: smoke exact PyPI version
    needs: [verify, verify-published]
    if: ${{ always() && needs.verify.result == 'success' && needs.verify-published.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PyPI's CDN edges refresh pip's index independently: on v0.64.0 (run 36287381452)
      # verify-published saw the version, and this job's pip, about 15 s later, read an
      # edge without it. So the install itself retries, on the same deadline and interval
      # as scripts/check-registry-version.mjs (DEADLINE_MS, INTERVAL_MS; a test pins them).
      - name: install exact package into a fresh venv and smoke it
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEADLINE_S: 248
          INTERVAL_S: 12
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          deadline=$((SECONDS + DEADLINE_S))
          until "$smoke_dir/venv/bin/python" -m pip install --no-cache-dir "getanyapi==$VERSION"; do
            if (( SECONDS + INTERVAL_S > deadline )); then
              echo "::error::getanyapi==$VERSION not installable after $DEADLINE_S s"
              exit 1
            fi
            sleep "$INTERVAL_S"
          done
          cp "$GITHUB_WORKSPACE/smoke/pypi-smoke.py" "$smoke_dir/pypi-smoke.py"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" pypi-smoke.py

  github-release:
    name: github release
    needs: [verify, npm-smoke, pypi-smoke]
    if: ${{ always() && needs.verify.result == 'success' && needs.npm-smoke.result == 'success' && needs.pypi-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
          fetch-depth: 0
      - name: derive release notes from the tagged commit body
        id: notes
        env:
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          # The tag's annotated/commit message body carries the classifier change summary.
          # Strip the first (subject) line; keep the body as release notes. Fall back to a
          # generic line for a manual tag with no structured body.
          BODY="$(git log -1 --format=%b "$TAG" || true)"
          if [ -z "$BODY" ]; then
            BODY="Release $TAG."
          fi
          {
            echo "notes<<RELEOF"
            echo "$BODY"
            echo "RELEOF"
          } >> "$GITHUB_OUTPUT"
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.verify.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; exact-version recovery is complete."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES"

  # The only place the publish result is known. Between 2026-09-17 and 2026-09-25, 20 release
  # runs failed (17 of them after publishing) and none reached a human: nothing here reported,
  # and for the two an accept dispatched (v0.48.0, v0.59.0) accept-catalog-refresh.yml had
  # already closed the incident.
  report:
    name: report the release result on the regen incident
    needs: [verify, registry-state, publish-npm, publish-pypi, verify-published, npm-smoke, pypi-smoke, github-release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the workflow and issue CLI version matched during old-tag recovery.
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: close the regen incident after a successful publish
        if: needs.github-release.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/upsert-regen-issue.mjs \
            --title "$REGEN_ISSUE_TITLE" \
            --resolve \
            --body "release published \`$TAG\` to npm and PyPI, smoked both, and created its GitHub Release ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
      # github-release runs whenever verify and both smokes succeed, so anything short of its
      # success under !cancelled() means some job before it failed.
      - name: open or update the regen incident on a failed release
        if: needs.github-release.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(env.TAG): \(.key) \(.value.result)"' \
            <<<"$NEEDS" > release-items.txt
          # shellcheck disable=SC2016 # the backticks are Markdown code spans, not substitutions
          {
            printf '`release` did not finish `%s`. npm, PyPI, or the GitHub Release may be missing it until it does.\n\n' "$TAG"
            printf '## What failed\n\n'
            sed 's/^/- /' release-items.txt
            printf '\n[Failing run](%s)\n' "$RUN_URL"
            printf '\nA fresh run resumes safely: registry-state skips a registry that already serves this exact version.\n\n'
            printf '```\ngh workflow run release.yml -R %s --ref main -f tag=%s\n```\n' "$GITHUB_REPOSITORY" "$TAG"
          } > release-issue.md
          node scripts/upsert-regen-issue.mjs \
            --title "$REGEN_ISSUE_TITLE" \
            --body-file release-issue.md \
            --items "$(cat release-items.txt)"
