name: release

# Publish @getanyapi/sdk (npm) and getanyapi (PyPI) for a version tag.
#
# Triggers:
#   - push tag v*: a human-pushed tag (the first manual v0.1.0), or any future manual tag.
#   - workflow_dispatch (input: tag): how regen.yml kicks a release after auto-tagging, since
#     a tag pushed by the default GITHUB_TOKEN does not fire the tag-`push` trigger.
#
# Flow: verify -> query both registries -> publish only missing sides -> re-query both ->
# smoke both exact versions -> GitHub Release. npm publishes with provenance (id-token).
# PyPI uses trusted publishing (OIDC, environment `pypi`) and never falls back to a token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to release (e.g. v0.1.0). Must already exist."
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (full gate + version match)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: resolve tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "tag '$TAG' does not start with 'v'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pnpm install --frozen-lockfile

      - name: assert tag matches both manifests and Python runtime version (lockstep)
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          MANIFEST="$(pnpm --silent --filter @anyapi/generator run version:current)"
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "tag version ($VERSION) does not match manifest version ($MANIFEST)"
            exit 1
          fi
          echo "version match: $VERSION"

      # Mirror ci.yml gates (duplication over indirection; correctness first).
      - name: install pinned ruff (generated-Python formatting is part of byte determinism)
        run: pip install ruff==0.15.20
      - name: generator typecheck + vitest
        run: pnpm --filter @anyapi/generator run check
      - name: regen drift (byte-identical)
        run: pnpm run generate:check
      - name: typescript (tsc strict + vitest + tsup + consumer typecheck)
        run: |
          pnpm --filter @getanyapi/sdk run check
          pnpm --filter @getanyapi/sdk run consumer-typecheck
      - name: install python package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/python[dev]"
      - name: pyright + mypy --strict + pytest
        working-directory: packages/python
        run: |
          pyright
          mypy
          pytest
      - name: credentialless TypeScript live discovery canary
        run: node scripts/live-discovery-ts.mjs
      - name: credentialless Python live discovery canary
        run: python scripts/live-discovery-python.py
      - name: dash guard
        run: bash scripts/check-dashes.sh

  registry-state:
    name: query exact version in both registries
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      npm_exists: ${{ steps.state.outputs.npm_exists }}
      pypi_exists: ${{ steps.state.outputs.pypi_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: query npm and PyPI
        id: state
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/check-registry-version.mjs "$VERSION" --github-output "$GITHUB_OUTPUT"

  publish-npm:
    name: publish @getanyapi/sdk (npm)
    needs: [verify, registry-state]
    if: needs.registry-state.outputs.npm_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: build (tsup -> ESM + CJS + d.ts)
        run: pnpm --filter @getanyapi/sdk run build
      - name: publish
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public --provenance

  publish-pypi:
    name: publish getanyapi (PyPI, trusted publishing)
    needs: [verify, registry-state]
    if: needs.registry-state.outputs.pypi_exists == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: build sdist + wheel
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish via trusted publishing
        # Fails with a clear message until the PyPI trusted publisher is configured (see
        # README "Releasing"). We do NOT fall back to a token; configure the publisher instead.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  verify-published:
    name: re-query exact version in both registries
    needs: [verify, registry-state, publish-npm, publish-pypi]
    if: ${{ always() && needs.verify.result == 'success' && needs.registry-state.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: require both exact versions
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/check-registry-version.mjs "$VERSION" --require-both

  npm-smoke:
    name: smoke exact npm version
    needs: [verify, verify-published]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install exact package into a clean directory and smoke it
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "@getanyapi/sdk@$VERSION"
          cp "$GITHUB_WORKSPACE/smoke/npm-smoke.mjs" ./npm-smoke.mjs
          node npm-smoke.mjs

  pypi-smoke:
    name: smoke exact PyPI version
    needs: [verify, verify-published]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install exact package into a fresh venv and smoke it
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install "getanyapi==$VERSION"
          cp "$GITHUB_WORKSPACE/smoke/pypi-smoke.py" "$smoke_dir/pypi-smoke.py"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" pypi-smoke.py

  github-release:
    name: github release
    needs: [verify, npm-smoke, pypi-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.verify.outputs.version }}
          fetch-depth: 0
      - name: derive release notes from the tagged commit body
        id: notes
        env:
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          # The tag's annotated/commit message body carries the classifier change summary.
          # Strip the first (subject) line; keep the body as release notes. Fall back to a
          # generic line for a manual tag with no structured body.
          BODY="$(git log -1 --format=%b "$TAG" || true)"
          if [ -z "$BODY" ]; then
            BODY="Release $TAG."
          fi
          {
            echo "notes<<RELEOF"
            echo "$BODY"
            echo "RELEOF"
          } >> "$GITHUB_OUTPUT"
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.verify.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; exact-version recovery is complete."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES"
